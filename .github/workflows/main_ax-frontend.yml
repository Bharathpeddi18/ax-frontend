
name: Build and deploy Next.js app to Azure - ax-frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js application
        env:
          NEXT_PUBLIC_BACKEND_API_URL: ${{ vars.NEXT_PUBLIC_BACKEND_API_URL }}
        run: |
          if [ -z "$NEXT_PUBLIC_BACKEND_API_URL" ]; then
            echo "ERROR: Backend API URL is missing"
            exit 1
          fi

          echo "SUCCESS: Backend API URL is available"
          npm run build

      - name: Prepare standalone deployment
        run: |
          mkdir -p deployment
          cp -a .next/standalone/. deployment/

          mkdir -p deployment/.next
          cp -a .next/static deployment/.next/static

          if [ -d public ]; then
            cp -a public deployment/public
          fi

      - name: Verify deployment files
        run: |
          ls -la deployment
          ls -la deployment/.next
          test -f deployment/server.js

      - name: Create deployment ZIP
        run: |
          cd deployment
          zip -qr ../deployment.zip .

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deployment.zip
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_7D670980499B40FD833005CEEEC8E6BC }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_E367A0E435EB475298D9A51E48FD26C0 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_40461B263DBA4EC0913B5752E9736DCC }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'ax-frontend'
          slot-name: 'Production'
          package: deployment.zip
